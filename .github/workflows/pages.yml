name: Pages

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python (for corpus regeneration)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bridge (for codec.py)
        run: pip install -e ros2-bridge
      - name: Verify corpus is fresh
        run: |
          python ros2-bridge/tests/corpus/regenerate.py
          git diff --exit-code ros2-bridge/tests/corpus
      - name: Run JS tests
        run: cd web-flasher && npm test
      - name: Stage site
        # Pages serves the contents of the uploaded artifact root.
        # We copy the flasher and the corpus that the JS parity test
        # consumed, so the deployed site is self-contained.
        run: |
          mkdir _site
          cp -R web-flasher/* _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
