name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  bridge:
    name: ros2-bridge tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bridge with test extras
        run: pip install -e 'ros2-bridge[test,dev]'
      - name: Lint
        run: cd ros2-bridge && ruff check .
      - name: Tests with coverage
        run: cd ros2-bridge && pytest --cov=rosserial2 --cov-report=term-missing
