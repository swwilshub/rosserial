name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  bridge:
    name: ros2-bridge tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bridge with test extras
        run: pip install -e 'ros2-bridge[test,dev]'
      - name: Lint
        run: cd ros2-bridge && ruff check .
      - name: Tests with coverage
        run: cd ros2-bridge && pytest --cov=rosserial2 --cov-report=term-missing

  firmware-codec:
    name: firmware codec (host build + parity)
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bridge (for codec.py used by corpus generator)
        run: pip install -e ros2-bridge
      - name: Regenerate cross-language corpus
        # The corpus is checked in; regenerating here and diffing
        # catches accidental drift between codec.py and the corpus.
        run: |
          python ros2-bridge/tests/corpus/regenerate.py
          git diff --exit-code ros2-bridge/tests/corpus
      - name: Configure (CMake)
        run: cmake -S esp32-firmware/host_test -B esp32-firmware/host_test/build
      - name: Build (Catch2 + tests)
        run: cmake --build esp32-firmware/host_test/build -j
      - name: Run tests
        run: esp32-firmware/host_test/build/test_codec --reporter console::out=-::colour-mode=ansi

  web-flasher:
    name: web-flasher (JS codec parity + lint)
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify corpus is up to date
        run: |
          python -m pip install -e ros2-bridge
          python ros2-bridge/tests/corpus/regenerate.py
          git diff --exit-code ros2-bridge/tests/corpus
      - name: Run JS tests
        run: cd web-flasher && npm test
